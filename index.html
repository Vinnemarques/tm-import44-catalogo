function paletteFor(id) {
  let hash = 0;
  for (let i = 0; i < id.length; i++) hash = (hash * 31 + id.charCodeAt(i)) >>> 0;
  return JERSEY_PALETTES[hash % JERSEY_PALETTES.length];
}

async function sb(path, options = {}) {
  const { method = 'GET', body, prefer, token } = options;
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
    method,
    headers: {
      apikey: SUPABASE_ANON_KEY,
      Authorization: `Bearer ${token || SUPABASE_ANON_KEY}`,
      'Content-Type': 'application/json',
      Prefer: prefer || 'return=representation',
    },
    body: body !== undefined ? JSON.stringify(body) : undefined,
  });
  if (!res.ok) {
    const text = await res.text().catch(() => '');
    throw new Error(`Supabase ${method} ${path} -> ${res.status}: ${text}`);
  }
  if (res.status === 204) return null;
  const text = await res.text();
  return text ? JSON.parse(text) : null;
}

async function authLogin(email, password) {
  const res = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=password`, {
    method: 'POST',
    headers: { apikey: SUPABASE_ANON_KEY, 'Content-Type': 'application/json' },
    body: JSON.stringify({ email, password }),
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error_description || data.msg || 'E-mail ou senha incorretos.');
  return data;
}

    ts: new Date(row.created_at).getTime(),
    productId: row.product_id,
    name: row.product_name,
    type: row.product_type,
    size: row.size,
    payment: row.payment,
    price: Number(row.price),
    cost: Number(row.cost),
    stock: row.was_pronta_entrega ? 1 : 0,
    status: row.status,
  };
}
function dbToSupplier(row) {
  return {
    id: row.id,
    name: row.name,
    whatsapp: row.whatsapp || '',
    notes: row.notes || '',
    orders: (row.supplier_orders || [])
      .map(o => ({ id: o.id, description: o.description, value: Number(o.value), date: new Date(o.order_date).getTime() }))
      .sort((a, b) => b.date - a.date),
  };
}

const uid = () => Math.random().toString(36).slice(2, 10);

const iconBtnStyle = { position: 'relative', width: 36, height: 36, borderRadius: 10, background: '#171D1A', border: '1px solid #262E2A', display: 'flex', alignItems: 'center', justifyContent: 'center', cursor: 'pointer' };
const badgeStyle = { position: 'absolute', top: -4, right: -4, background: '#E8B94E', color: '#111', fontSize: 10, fontWeight: 700, borderRadius: 999, minWidth: 16, height: 16, display: 'flex', alignItems: 'center', justifyContent: 'center', padding: '0 3px' };
const labelStyle = { display: 'block', fontSize: 9, color: '#8A9690', letterSpacing: 1, marginBottom: 6 };
const inputStyle = { width: '100%', background: '#171D1A', border: '1px solid #262E2A', borderRadius: 8, padding: '9px 10px', color: '#F4F7F2', fontSize: 13, outline: 'none', marginBottom: 12, boxSizing: 'border-box' };

function JerseyThumb({ product, size = 'normal' }) {
  if (product.image) {
    return <img src={product.image} alt={product.name} style={{ width: '100%', height: '100%', objectFit: 'cover', display: 'block' }} />;
  }
  const [c1, c2] = paletteFor(product.id);
  const initials = product.name.split(' ').map(w => w[0]).join('').slice(0, 3).toUpperCase();
  return (
    <div style={{ width: '100%', height: '100%', background: `linear-gradient(135deg, ${c1}, ${c2})`, display: 'flex', alignItems: 'center', justifyContent: 'center', position: 'relative', overflow: 'hidden' }}>
      <Shirt size={size === 'large' ? 90 : 44} color="rgba(255,255,255,0.16)" style={{ position: 'absolute' }} />
      <span className="font-display" style={{ color: '#fff', fontSize: size === 'large' ? 42 : 20, letterSpacing: 1, textShadow: '0 2px 6px rgba(0,0,0,0.4)' }}>{initials}</span>
    </div>
  );
}

function AvailabilityBadge({ stock, size = 'normal' }) {
  const pronta = (Number(stock) || 0) > 0;
  return (
    <div style={{ display: 'inline-flex', alignItems: 'center', gap: 5, padding: size === 'large' ? '5px 10px' : '3px 7px', borderRadius: 999,
      background: pronta ? '#132420' : '#1D2422', border: '1px solid ' + (pronta ? '#34D399' : '#8A9690') }}>
      <div style={{ width: 5, height: 5, borderRadius: 99, background: pronta ? '#34D399' : '#E8B94E', flexShrink: 0 }} />
      <span className="font-mono" style={{ fontSize: size === 'large' ? 10 : 8, letterSpacing: 0.5, color: pronta ? '#34D399' : '#B8C2BC' }}>
        {pronta ? `PRONTA ENTREGA · ${stock} UN.` : 'SOB ENCOMENDA · 20-30 DIAS'}
      </span>
    </div>
  );
}

function PriceBadge({ pix, credito, compact = false }) {
  return (
    <div style={{ display: 'flex', borderRadius: 10, overflow: 'hidden', border: '1px solid #262E2A' }}>
      <div style={{ flex: 1, background: '#132420', padding: compact ? '4px 8px' : '8px 10px' }}>
        <div className="font-mono" style={{ fontSize: 9, color: '#34D399', letterSpacing: 1 }}>PIX</div>
        <div className="font-display" style={{ fontSize: compact ? 14 : 20, color: '#F4F7F2' }}>R$ {pix}</div>
      </div>
      <div style={{ flex: 1, background: '#171D1A', padding: compact ? '4px 8px' : '8px 10px' }}>
        <div className="font-mono" style={{ fontSize: 9, color: '#8A9690', letterSpacing: 1 }}>CRÉDITO</div>
        <div className="font-display" style={{ fontSize: compact ? 14 : 20, color: '#B8C2BC' }}>R$ {credito}</div>
      </div>
    </div>
  );
}

function App() {
  const [loaded, setLoaded] = useState(false);
  const [products, setProducts] = useState([]);
  const [leads, setLeads] = useState([]);
  const [suppliers, setSuppliers] = useState([]);
  const [view, setView] = useState('catalog');
  const [category, setCategory] = useState('Todos');
  const [query, setQuery] = useState('');
  const [selected, setSelected] = useState(null);
  const [selectedSize, setSelectedSize] = useState(null);
  const [payment, setPayment] = useState('pix');
  const [cart, setCart] = useState([]);
  const [cartOpen, setCartOpen] = useState(false);
  const [toast, setToast] = useState(null);

  const [session, setSession] = useState(null);
  const [adminAuthed, setAdminAuthed] = useState(false);
  const [emailInput, setEmailInput] = useState(ADMIN_EMAIL_DEFAULT);
  const [pwInput, setPwInput] = useState('');
  const [pwError, setPwError] = useState(false);
  const [pwErrorMsg, setPwErrorMsg] = useState('');
  const [showPw, setShowPw] = useState(false);
  const [loggingIn, setLoggingIn] = useState(false);
  const [adminTab, setAdminTab] = useState('produtos');
  const [editing, setEditing] = useState(null);
  const [editingSupplier, setEditingSupplier] = useState(null);
  const [addingOrderFor, setAddingOrderFor] = useState(null);
  const [orderDraft, setOrderDraft] = useState({ description: '', value: '' });

  useEffect(() => {
    (async () => {
      try {
        const prodRows = await sb('products?select=*&order=created_at.asc');
        setProducts((prodRows || []).map(dbToProduct));
      } catch (err) {
        console.error(err);
      }
      setLoaded(true);
    })();
  }, []);

  async function loadAdminData(token) {
    try {
      const [prodRows, orderRows, supplierRows] = await Promise.all([
        sb('products?select=*&order=created_at.asc', { token }),
        sb('orders?select=*&order=created_at.desc', { token }),
        sb('suppliers?select=*,supplier_orders(*)&order=created_at.desc', { token }),
      ]);
      setProducts((prodRows || []).map(dbToProduct));
      setLeads((orderRows || []).map(dbToLead));
      setSuppliers((supplierRows || []).map(dbToSupplier));
    } catch (err) {
      console.error(err);
      showToast('Erro ao carregar dados do admin');
    }
  }

  function showToast(msg) {
    setToast(msg);
    setTimeout(() => setToast(null), 2200);
  }

  const filtered = products
    .filter(p => p.active !== false)
    .filter(p => category === 'Todos' || p.category === category)
    .filter(p => p.name.toLowerCase().includes(query.toLowerCase()));

  function buildWaLink(items) {
    const lines = items.map(it => `- ${it.name} (${TYPE_LABELS[it.type]}) Tam ${it.size} - ${it.payment === 'pix' ? 'Pix' : 'Crédito'}: R$ ${it.price}${(Number(it.stock) || 0) === 0 ? ' [Sob encomenda, prazo 20-30 dias]' : ' [Pronta entrega]'}`).join('\n');
    const total = items.reduce((s, it) => s + it.price, 0);
    const text = `Olá! Tenho interesse em comprar:\n${lines}\n\nTotal: R$ ${total}`;
    return `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(text)}`;
  }

  async function registerLeadAndGo(items) {
    try {
      const payload = items.map(it => ({
        product_id: it.productId || null,
        product_name: it.name,
        product_type: it.type,
        size: it.size,
        payment: it.payment,
        price: it.price,
        cost: it.cost || 0,
        was_pronta_entrega: (Number(it.stock) || 0) > 0,
        status: 'encomendado',
      }));
      const rows = await sb('orders', { method: 'POST', body: payload });
      setLeads(prev => [...(rows || []).map(dbToLead), ...prev]);
    } catch (err) {
      console.error(err);
      showToast('Não deu para salvar no banco, mas o pedido foi enviado');
    }
    window.open(buildWaLink(items), '_blank');
  }

  function addToCart() {
    if (!selectedSize) { showToast('Selecione um tamanho'); return; }
    const price = payment === 'pix' ? selected.pricePix : selected.priceCredito;
    setCart(c => [...c, { cid: uid(), productId: selected.id, name: selected.name, type: selected.type, size: selectedSize, payment, price, cost: selected.cost || 0, stock: selected.stock || 0 }]);
    showToast('Adicionado à sacola');
    setSelected(null);
  }

  function buyNow() {
    if (!selectedSize) { showToast('Selecione um tamanho'); return; }
    const price = payment === 'pix' ? selected.pricePix : selected.priceCredito;
    registerLeadAndGo([{ productId: selected.id, name: selected.name, type: selected.type, size: selectedSize, payment, price, cost: selected.cost || 0, stock: selected.stock || 0 }]);
    setSelected(null);
  }

  function checkoutCart() {
    if (cart.length === 0) return;
    registerLeadAndGo(cart.map(it => ({ productId: it.productId, name: it.name, type: it.type, size: it.size, payment: it.payment, price: it.price, cost: it.cost || 0, stock: it.stock || 0 })));
    setCart([]);
    setCartOpen(false);
  }


  async function tryLogin() {
    setPwError(false);
    setLoggingIn(true);
    try {
      const data = await authLogin(emailInput, pwInput);
      setSession({ accessToken: data.access_token, email: data.user?.email || emailInput });
      setAdminAuthed(true);
      setPwInput('');
      await loadAdminData(data.access_token);
    } catch (err) {
      console.error(err);
      setPwErrorMsg(err.message || 'E-mail ou senha incorretos.');
      setPwError(true);
    } finally {
      setLoggingIn(false);
    }
  }

  function logoutAdmin() {
    setAdminAuthed(false);
    setSession(null);
    setLeads([]);
    setSuppliers([]);
    setView('catalog');
  }

  function newProductTemplate() {
    return { id: null, name: '', category: 'Futebol', type: 'Torcedor', sizes: [], pricePix: DEFAULT_PRICES.Torcedor.pix, priceCredito: DEFAULT_PRICES.Torcedor.credito, image: '', active: true, stock: 0, cost: 0 };
  }

  function handlePhotoFile(file) {
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => setEditing(e => ({ ...e, image: reader.result }));
    reader.readAsDataURL(file);
  }

  function toggleSize(s) {
    setEditing(e => ({ ...e, sizes: e.sizes.includes(s) ? e.sizes.filter(x => x !== s) : [...e.sizes, s] }));
  }

  async function saveProduct() {
    if (!editing.name.trim() || editing.sizes.length === 0) { showToast('Preencha nome e ao menos um tamanho'); return; }
    const payload = productToDbPayload(editing);
    const token = session?.accessToken;
    try {
      if (editing.id) {
        const rows = await sb(`products?id=eq.${editing.id}`, { method: 'PATCH', body: payload, token });
        const updated = dbToProduct(rows[0]);
        setProducts(prev => prev.map(p => (p.id === updated.id ? updated : p)));
      } else {
        const rows = await sb('products', { method: 'POST', body: payload, token });
        const created = dbToProduct(rows[0]);
        setProducts(prev => [created, ...prev]);
      }
      setEditing(null);
      showToast('Produto salvo');
    } catch (err) {
      console.error(err);
      showToast('Erro ao salvar produto');
    }
  }
  async function deleteProduct(id) {
    try {
      await sb(`products?id=eq.${id}`, { method: 'DELETE', prefer: 'return=minimal', token: session?.accessToken });
      setProducts(prev => prev.filter(p => p.id !== id));
    } catch (err) {
      console.error(err);
      showToast('Erro ao excluir produto');
    }
  }
  async function toggleActive(id) {
    const prod = products.find(p => p.id === id);
    if (!prod) return;
    try {
      await sb(`products?id=eq.${id}`, { method: 'PATCH', body: { active: !prod.active }, prefer: 'return=minimal', token: session?.accessToken });
      setProducts(prev => prev.map(p => (p.id === id ? { ...p, active: !p.active } : p)));
    } catch (err) {
      console.error(err);
      showToast('Erro ao atualizar produto');
    }
  }

  async function deleteLead(id) {
    try {
      await sb(`orders?id=eq.${id}`, { method: 'DELETE', prefer: 'return=minimal', token: session?.accessToken });
      setLeads(prev => prev.filter(l => l.id !== id));
      showToast('Pedido removido');
    } catch (err) {
      console.error(err);
      showToast('Erro ao remover pedido');
    }
  }
  async function toggleLeadStatus(id) {
    const lead = leads.find(l => l.id === id);
    if (!lead) return;
    const newStatus = lead.status === 'entregue' ? 'encomendado' : 'entregue';
    try {
      await sb(`orders?id=eq.${id}`, { method: 'PATCH', body: { status: newStatus, delivered_at: newStatus === 'entregue' ? new Date().toISOString() : null }, prefer: 'return=minimal', token: session?.accessToken });
      setLeads(prev => prev.map(l => (l.id === id ? { ...l, status: newStatus } : l)));
    } catch (err) {
      console.error(err);
      showToast('Erro ao atualizar status');
    }
  }

  function newSupplierTemplate() {
    return { id: null, name: '', whatsapp: '', notes: '', orders: [] };
  }
  async function saveSupplier() {
    if (!editingSupplier.name.trim()) { showToast('Preencha o nome do fornecedor'); return; }
    const payload = { name: editingSupplier.name, whatsapp: editingSupplier.whatsapp || null, notes: editingSupplier.notes || null };
    const token = session?.accessToken;
    try {
      if (editingSupplier.id) {
        await sb(`suppliers?id=eq.${editingSupplier.id}`, { method: 'PATCH', body: payload, prefer: 'return=minimal', token });
        setSuppliers(prev => prev.map(s => (s.id === editingSupplier.id ? { ...s, name: payload.name, whatsapp: payload.whatsapp || '', notes: payload.notes || '' } : s)));
      } else {
        const rows = await sb('suppliers', { method: 'POST', body: payload, token });
        setSuppliers(prev => [{ ...dbToSupplier(rows[0]), orders: [] }, ...prev]);
      }
      setEditingSupplier(null);
      showToast('Fornecedor salvo');
    } catch (err) {
      console.error(err);
      showToast('Erro ao salvar fornecedor');
    }
  }
  async function deleteSupplier(id) {
    try {
      await sb(`suppliers?id=eq.${id}`, { method: 'DELETE', prefer: 'return=minimal', token: session?.accessToken });
      setSuppliers(prev => prev.filter(s => s.id !== id));
    } catch (err) {
      console.error(err);
      showToast('Erro ao excluir fornecedor');
    }
  }
  async function addOrderToSupplier(supplierId) {
    if (!orderDraft.description.trim() || !orderDraft.value) { showToast('Preencha descrição e valor'); return; }
    try {
      const rows = await sb('supplier_orders', { method: 'POST', body: { supplier_id: supplierId, description: orderDraft.description, value: Number(orderDraft.value) }, token: session?.accessToken });
      const row = rows[0];
      const newOrder = { id: row.id, description: row.description, value: Number(row.value), date: new Date(row.order_date).getTime() };
      setSuppliers(prev => prev.map(s => (s.id === supplierId ? { ...s, orders: [newOrder, ...s.orders] } : s)));
      setOrderDraft({ description: '', value: '' });
      setAddingOrderFor(null);
    } catch (err) {
      console.error(err);
      showToast('Erro ao adicionar pedido');
    }
  }
  async function deleteSupplierOrder(supplierId, orderId) {
    try {
      await sb(`supplier_orders?id=eq.${orderId}`, { method: 'DELETE', prefer: 'return=minimal', token: session?.accessToken });
      setSuppliers(prev => prev.map(s => (s.id === supplierId ? { ...s, orders: s.orders.filter(o => o.id !== orderId) } : s)));
    } catch (err) {
      console.error(err);
      showToast('Erro ao remover pedido do fornecedor');
    }
  }

  function renderCatalog() {
    return (
      <div className="anim-fadeIn" style={{ padding: '14px 16px 90px' }}>
        <div style={{ position: 'relative', marginBottom: 12 }}>
          <Search size={15} color="#8A9690" style={{ position: 'absolute', left: 12, top: '50%', transform: 'translateY(-50%)' }} />
          <input
            value={query}
            onChange={e => setQuery(e.target.value)}
            placeholder="Buscar time ou produto..."
            className="font-body"

          />
        </div>

        <div style={{ display: 'flex', gap: 8, overflowX: 'auto', marginBottom: 16, paddingBottom: 2 }}>
          {CATS.map(c => (
            <button key={c.key} onClick={() => setCategory(c.key)} className="tap-scale font-mono"
              style={{ flexShrink: 0, padding: '6px 12px', borderRadius: 999, fontSize: 11, letterSpacing: 0.5, cursor: 'pointer',
                background: category === c.key ? '#E8B94E' : '#171D1A',
                color: category === c.key ? '#111' : '#8A9690',
                border: '1px solid ' + (category === c.key ? '#E8B94E' : '#262E2A') }}>
              {c.label.toUpperCase()}
            </button>
          ))}
        </div>

        <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 6, marginBottom: 16, textAlign: 'center' }}>
          <Flame size={12} color="#E8B94E" style={{ flexShrink: 0 }} />
          <span className="font-body" style={{ fontSize: 11, color: '#8A9690', fontStyle: 'italic' }}>Vista a camisa, viva a paixão pelo seu time.</span>
        </div>

        {filtered.length === 0 ? (
          <div style={{ textAlign: 'center', padding: '60px 20px', color: '#8A9690' }}>
            <Shirt size={32} style={{ margin: '0 auto 10px', opacity: 0.4 }} />
            <div className="font-body" style={{ fontSize: 13 }}>Nenhuma camisa encontrada.</div>
          </div>
        ) : (
          <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 12 }}>
            {filtered.map((p, i) => (
              <button key={p.id} onClick={() => { setSelected(p); setSelectedSize(null); setPayment('pix'); }}
                className="tap-scale anim-fadeUp" style={{ animationDelay: i * 0.05 + 's', textAlign: 'left', background: '#171D1A', border: '1px solid #262E2A', borderRadius: 14, overflow: 'hidden', cursor: 'pointer', padding: 0 }}>
                <div style={{ aspectRatio: '1 / 1', width: '100%' }}>
                  <JerseyThumb product={p} />
                </div>
                <div style={{ padding: 10 }}>
                  <div className="font-mono" style={{ fontSize: 9, color: '#8A9690', letterSpacing: 1, marginBottom: 2 }}>{TYPE_LABELS[p.type].toUpperCase()}</div>
                  <div className="font-display" style={{ fontSize: 15, color: '#F4F7F2', marginBottom: 8, lineHeight: 1.1 }}>{p.name}</div>
                  <PriceBadge pix={p.pricePix} credito={p.priceCredito} compact />
                  <div style={{ marginTop: 6 }}><AvailabilityBadge stock={p.stock} /></div>
                </div>
              </button>
            ))}
          </div>
        )}
      </div>
    );
  }

  function renderProductModal() {
    const p = selected;
    return (
      <div className="anim-fadeIn" style={{ position: 'absolute', inset: 0, background: 'rgba(5,7,6,0.7)', zIndex: 30, display: 'flex', alignItems: 'flex-end' }} onClick={() => setSelected(null)}>
        <div className="anim-slideUp" onClick={e => e.stopPropagation()} style={{ width: '100%', maxHeight: '88%', overflowY: 'auto', background: '#0E1210', borderTopLeftRadius: 24, borderTopRightRadius: 24, border: '1px solid #262E2A' }}>
          <div style={{ width: 36, height: 4, background: '#262E2A', borderRadius: 99, margin: '10px auto' }} />
          <div style={{ position: 'relative' }}>
            <div style={{ aspectRatio: '4 / 3', width: '100%' }}><JerseyThumb product={p} size="large" /></div>
            <button className="tap-scale" onClick={() => setSelected(null)} style={{ ...iconBtnStyle, position: 'absolute', top: 12, right: 12, background: 'rgba(14,18,16,0.7)' }}>
              <X size={16} color="#fff" />
            </button>
          </div>
          <div style={{ padding: '16px 18px 24px' }}>
            <div className="font-mono" style={{ fontSize: 10, color: '#8A9690', letterSpacing: 1, marginBottom: 4 }}>
              {CATEGORY_LABELS[p.category].toUpperCase()} · {TYPE_LABELS[p.type].toUpperCase()}
            </div>
            <div className="font-display" style={{ fontSize: 26, color: '#F4F7F2', marginBottom: 10 }}>{p.name}</div>
            <div style={{ marginBottom: 16 }}>
              <AvailabilityBadge stock={p.stock} size="large" />
              {(Number(p.stock) || 0) === 0 && (
                <div className="font-body" style={{ fontSize: 11, color: '#8A9690', marginTop: 8, lineHeight: 1.4 }}>
                  Esta camisa é feita por encomenda. Após a confirmação do pedido, o prazo de entrega é de 20 a 30 dias.
                </div>
              )}
            </div>

            <div style={{ marginBottom: 16 }}>
              <div className="font-mono" style={labelStyle}>TAMANHO</div>
              <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap' }}>
                {p.sizes.map(s => (
                  <button key={s} onClick={() => setSelectedSize(s)} className="tap-scale font-display"
                    style={{ width: 40, height: 40, borderRadius: 10, fontSize: 13, cursor: 'pointer',
                      background: selectedSize === s ? '#E8B94E' : '#171D1A',
                      color: selectedSize === s ? '#111' : '#F4F7F2',
                      border: '1px solid ' + (selectedSize === s ? '#E8B94E' : '#262E2A') }}>
                    {s}
                  </button>
                ))}
              </div>
            </div>

            <div style={{ marginBottom: 18 }}>
              <div className="font-mono" style={labelStyle}>PAGAMENTO</div>
              <div style={{ display: 'flex', gap: 8 }}>
                <button onClick={() => setPayment('pix')} className="tap-scale" style={{ flex: 1, borderRadius: 12, padding: '10px 12px', textAlign: 'left', cursor: 'pointer',
                  background: payment === 'pix' ? '#132420' : '#171D1A', border: '1px solid ' + (payment === 'pix' ? '#34D399' : '#262E2A') }}>
                  <div className="font-mono" style={{ fontSize: 9, color: '#34D399', letterSpacing: 1 }}>PIX</div>
                  <div className="font-display" style={{ fontSize: 20, color: '#F4F7F2' }}>R$ {p.pricePix}</div>
                </button>
                <button onClick={() => setPayment('credito')} className="tap-scale" style={{ flex: 1, borderRadius: 12, padding: '10px 12px', textAlign: 'left', cursor: 'pointer',
                  background: payment === 'credito' ? '#1D2422' : '#171D1A', border: '1px solid ' + (payment === 'credito' ? '#B8C2BC' : '#262E2A') }}>
                  <div className="font-mono" style={{ fontSize: 9, color: '#8A9690', letterSpacing: 1 }}>CRÉDITO</div>
                  <div className="font-display" style={{ fontSize: 20, color: '#F4F7F2' }}>R$ {p.priceCredito}</div>
                </button>
              </div>
            </div>

                      <div className="font-mono" style={{ fontSize: 9, color: '#8A9690' }}>peças entregues</div>
                    </div>
                    <div style={{ background: '#132420', border: '1px solid #34D399', borderRadius: 12, padding: 12 }}>
                      <div style={{ display: 'flex', alignItems: 'center', gap: 6, marginBottom: 6 }}>
                        <TrendingUp size={13} color="#34D399" />
                        <span className="font-mono" style={{ fontSize: 9, color: '#34D399', letterSpacing: 1 }}>LUCRO</span>
                      </div>
                      <div className="font-display" style={{ fontSize: 22, color: '#34D399' }}>R$ {lucro}</div>
                      <div className="font-mono" style={{ fontSize: 9, color: '#8A9690' }}>faturamento − custo</div>
                    </div>
                  </div>

                  {baixoEstoque.length > 0 && (
                    <div style={{ marginBottom: 4 }}>
                      <div className="font-mono" style={{ fontSize: 9, color: '#8A9690', letterSpacing: 1, marginBottom: 8, display: 'flex', alignItems: 'center', gap: 6 }}>
                        <AlertTriangle size={12} color="#E8B94E" /> ESTOQUE BAIXO
                      </div>
                      {baixoEstoque.map(p => (
                        <div key={p.id} style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', background: '#171D1A', border: '1px solid #262E2A', borderRadius: 10, padding: '8px 12px', marginBottom: 6 }}>
                          <span className="font-body" style={{ fontSize: 12.5, color: '#F4F7F2' }}>{p.name}</span>
                          <span className="font-display" style={{ fontSize: 13, color: '#E5484D' }}>{p.stock || 0} un.</span>
                        </div>
                      ))}
                    </div>
                  )}
                </>
              );
            })()}
          </>
        ) : adminTab === 'fornecedores' ? (
          <>
            <button onClick={() => setEditingSupplier(newSupplierTemplate())} className="tap-scale font-body" style={{ width: '100%', padding: 11, borderRadius: 10, background: '#171D1A', border: '1px dashed #34D399', color: '#34D399', fontSize: 13, fontWeight: 600, display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 6, marginBottom: 14, cursor: 'pointer' }}>
              <Plus size={15} /> Novo fornecedor
            </button>

            {suppliers.length > 0 && (
              <div style={{ background: '#171D1A', border: '1px solid #262E2A', borderRadius: 12, padding: 12, marginBottom: 14, display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                <span className="font-mono" style={{ fontSize: 9, color: '#8A9690', letterSpacing: 1 }}>TOTAL GASTO C/ FORNECEDORES</span>
                <span className="font-display" style={{ fontSize: 18, color: '#E8B94E' }}>
                  R$ {suppliers.reduce((s, sup) => s + sup.orders.reduce((a, o) => a + (Number(o.value) || 0), 0), 0)}
                </span>
              </div>
            )}

            {suppliers.length === 0 && (
              <div style={{ textAlign: 'center', color: '#8A9690', fontSize: 13, padding: '30px 0' }}>
                <Truck size={26} style={{ margin: '0 auto 10px', opacity: 0.4 }} />
                Nenhum fornecedor cadastrado.
              </div>
            )}

            {suppliers.map(s => {
              const total = s.orders.reduce((a, o) => a + (Number(o.value) || 0), 0);
              return (
                <div key={s.id} className="anim-fadeUp" style={{ background: '#171D1A', border: '1px solid #262E2A', borderRadius: 12, padding: 12, marginBottom: 10 }}>
                  <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: s.whatsapp ? 4 : 8 }}>
                    <div style={{ flex: 1, minWidth: 0 }}>
                      <div className="font-body" style={{ fontSize: 13.5, color: '#F4F7F2', fontWeight: 600, whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>{s.name}</div>
                    </div>
                    <button className="tap-scale" title="Editar" onClick={() => setEditingSupplier({ ...s })} style={{ ...iconBtnStyle, width: 26, height: 26 }}>
                      <span className="font-mono" style={{ fontSize: 9, color: '#E8B94E' }}>ED</span>
                    </button>
                    <button className="tap-scale" title="Excluir" onClick={() => deleteSupplier(s.id)} style={{ ...iconBtnStyle, width: 26, height: 26 }}>
                      <Trash2 size={12} color="#E5484D" />
                    </button>
                  </div>
                  {s.whatsapp && (
                    <div className="font-mono" style={{ fontSize: 9, color: '#8A9690', marginBottom: 8, display: 'flex', alignItems: 'center', gap: 4 }}>
                      <Phone size={10} /> {s.whatsapp}
                    </div>
                  )}

                  <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 8 }}>
                    <span className="font-mono" style={{ fontSize: 9, color: '#8A9690', letterSpacing: 0.5 }}>GASTO TOTAL COM ESSE FORNECEDOR</span>
                    <span className="font-display" style={{ fontSize: 15, color: '#34D399' }}>R$ {total}</span>
                  </div>

                  {s.orders.map(o => (
                    <div key={o.id} style={{ display: 'flex', alignItems: 'center', gap: 8, padding: '6px 0', borderTop: '1px solid #1D2422' }}>
                      <div style={{ flex: 1, minWidth: 0 }}>
                        <div className="font-body" style={{ fontSize: 12, color: '#F4F7F2', whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>{o.description}</div>
                        <div className="font-mono" style={{ fontSize: 8, color: '#8A9690' }}>{new Date(o.date).toLocaleDateString('pt-BR')}</div>
                      </div>
                      <span className="font-display" style={{ fontSize: 13, color: '#F4F7F2', flexShrink: 0 }}>R$ {o.value}</span>
                      <button className="tap-scale" onClick={() => deleteSupplierOrder(s.id, o.id)} style={{ background: 'none', border: 'none', cursor: 'pointer', flexShrink: 0 }}>
                        <X size={12} color="#8A9690" />
                      </button>
                    </div>
                  ))}

                  {addingOrderFor === s.id ? (
                    <div style={{ marginTop: 10, display: 'flex', gap: 6 }}>
                      <input value={orderDraft.description} onChange={e => setOrderDraft({ ...orderDraft, description: e.target.value })} placeholder="Descrição (ex: 10 camisas Retrô)" className="font-body" style={{ ...inputStyle, marginBottom: 0, flex: 2, fontSize: 11 }} />
                      <input type="number" value={orderDraft.value} onChange={e => setOrderDraft({ ...orderDraft, value: e.target.value })} placeholder="R$" className="font-body" style={{ ...inputStyle, marginBottom: 0, flex: 1, fontSize: 11 }} />
                      <button onClick={() => addOrderToSupplier(s.id)} className="tap-scale" style={{ ...iconBtnStyle, background: '#E8B94E', flexShrink: 0 }}>
                        <Check size={14} color="#111" />
                      </button>
                    </div>
                  ) : (
                    <button onClick={() => { setAddingOrderFor(s.id); setOrderDraft({ description: '', value: '' }); }} className="tap-scale font-body" style={{ width: '100%', marginTop: 10, padding: 8, borderRadius: 8, background: 'transparent', border: '1px dashed #262E2A', color: '#8A9690', fontSize: 11, fontWeight: 600, display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 5, cursor: 'pointer' }}>
                      <Plus size={12} /> Adicionar pedido/gasto
                    </button>
                  )}
                </div>
              );
            })}
          </>
        ) : (
          <>
            {leads.length === 0 ? (
              <div style={{ textAlign: 'center', color: '#8A9690', fontSize: 13, padding: '40px 0' }}>
                <ListChecks size={26} style={{ margin: '0 auto 10px', opacity: 0.4 }} />
                Nenhum interesse registrado ainda.
              </div>
            ) : leads.map(l => {
              const entregue = l.status === 'entregue';
              return (
                <div key={l.id} className="anim-fadeUp" style={{ display: 'flex', alignItems: 'flex-start', gap: 8, background: '#171D1A', border: '1px solid ' + (entregue ? '#34D399' : '#262E2A'), borderRadius: 12, padding: '10px 12px', marginBottom: 8 }}>
                  <div style={{ flex: 1, minWidth: 0 }}>
                    <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: 4, gap: 8 }}>
                      <span className="font-body" style={{ fontSize: 13, color: '#F4F7F2', fontWeight: 600 }}>{l.name}</span>
                      <span className="font-display" style={{ fontSize: 14, color: '#E8B94E', flexShrink: 0 }}>R$ {l.price}</span>
                    </div>
                    <div className="font-mono" style={{ fontSize: 9, color: '#8A9690', marginBottom: 8 }}>
                      {TYPE_LABELS[l.type]} · TAM {l.size} · {l.payment === 'pix' ? 'PIX' : 'CRÉDITO'} · {new Date(l.ts).toLocaleString('pt-BR')}
                    </div>
                    <button onClick={() => toggleLeadStatus(l.id)} className="tap-scale font-mono" style={{ display: 'inline-flex', alignItems: 'center', gap: 5, padding: '4px 9px', borderRadius: 999, cursor: 'pointer',
                      background: entregue ? '#132420' : '#1D2422', border: '1px solid ' + (entregue ? '#34D399' : '#8A9690') }}>
                      {entregue ? <Check size={10} color="#34D399" /> : <Truck size={10} color="#B8C2BC" />}
                      <span style={{ fontSize: 8, letterSpacing: 0.5, color: entregue ? '#34D399' : '#B8C2BC' }}>
                        {entregue ? 'ENTREGUE' : 'ENCOMENDADO · TOCAR P/ CONFIRMAR ENTREGA'}
                      </span>
                    </button>
                  </div>
                  <button className="tap-scale" title="Excluir/cancelar pedido" onClick={() => deleteLead(l.id)} style={{ ...iconBtnStyle, width: 26, height: 26, flexShrink: 0 }}>
                    <Trash2 size={12} color="#E5484D" />
                  </button>
                </div>
              );
            })}
          </>
        )}
      </div>
    );
  }

  if (!loaded) {
    return (
      <div style={{ minHeight: '100vh', display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', background: '#050706', gap: 14 }}>
        <img src={STORE_LOGO} alt={STORE_NAME} className="anim-fadeIn" style={{ width: 64, height: 64, borderRadius: 14, objectFit: 'cover' }} />
        <div className="font-mono anim-fadeIn" style={{ color: '#8A9690', fontSize: 13, letterSpacing: 2 }}>CARREGANDO...</div>
      </div>
    );
  }

  return (
    <div className="app-outer" style={{ background: '#050706', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap');
        .font-display { font-family: 'Anton', sans-serif; }
        .font-body { font-family: 'Inter', sans-serif; }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
        @keyframes fadeUp { from { opacity:0; transform:translateY(10px);} to {opacity:1; transform:translateY(0);} }
        @keyframes slideUp { from { transform: translateY(100%);} to { transform: translateY(0);} }
        @keyframes popIn { from { opacity:0; transform: translateX(-50%) scale(0.9);} to {opacity:1; transform: translateX(-50%) scale(1);} }
        @keyframes fadeIn { from {opacity:0;} to {opacity:1;} }
        .anim-fadeUp { animation: fadeUp 0.4s ease both; }
        .anim-slideUp { animation: slideUp 0.28s cubic-bezier(.22,1,.36,1) both; }
        .anim-popIn { animation: popIn 0.35s cubic-bezier(.22,1,.36,1) both; }
        .anim-fadeIn { animation: fadeIn 0.25s ease both; }
        .tap-scale { transition: transform 0.15s ease; }
        .tap-scale:active { transform: scale(0.96); }
        .app-outer { min-height: 100dvh; padding: 24px 12px; box-sizing: border-box; }
        .phone-frame { width: 390px; height: 800px; max-height: 92dvh; }
        @media (max-width: 480px) {
          .app-outer { padding: 0 !important; align-items: stretch !important; }
          .phone-frame { width: 100% !important; height: 100dvh !important; max-height: 100dvh !important; border-radius: 0 !important; box-shadow: none !important; border: none !important; }
        }
        .file-input::file-selector-button, .file-input::-webkit-file-upload-button {
          background: #E8B94E; color: #111; border: none; border-radius: 6px;
          padding: 7px 12px; font-family: 'Inter', sans-serif; font-weight: 600; font-size: 11px;
          margin-right: 10px; cursor: pointer;
        }
        button { font-family: inherit; }
        div::-webkit-scrollbar { display:none; }
      `}</style>

      <div className="font-body phone-frame" style={{ background: '#0E1210', borderRadius: 36, overflow: 'hidden', display: 'flex', flexDirection: 'column', boxShadow: '0 30px 60px rgba(0,0,0,0.5)', border: '1px solid #1D2422', position: 'relative' }}>

        <div style={{ padding: '18px 18px 12px', display: 'flex', alignItems: 'center', justifyContent: 'space-between', borderBottom: '1px solid #1D2422', flexShrink: 0, gap: 10 }}>
          <div style={{ display: 'flex', alignItems: 'center', gap: 10, minWidth: 0, flex: 1 }}>
            <div style={{ width: 34, height: 34, borderRadius: 8, overflow: 'hidden', flexShrink: 0, border: '1px solid #262E2A' }}>
              <img src={STORE_LOGO} alt={STORE_NAME} style={{ width: '100%', height: '100%', objectFit: 'cover', display: 'block' }} />
            </div>
            <div style={{ minWidth: 0 }}>
              <div className="font-display" style={{ fontSize: 18, color: '#F4F7F2', letterSpacing: 0.5, lineHeight: 1, whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>{STORE_NAME}</div>
              <div className="font-mono" style={{ fontSize: 9, color: '#8A9690', letterSpacing: 2, marginTop: 2 }}>FUTEBOL · NBA</div>
            </div>
          </div>
          <div style={{ display: 'flex', gap: 8, flexShrink: 0 }}>
            <button className="tap-scale" onClick={() => setCartOpen(true)} style={iconBtnStyle}>
              <ShoppingBag size={18} color="#F4F7F2" />
              {cart.length > 0 && <span style={badgeStyle}>{cart.length}</span>}
            </button>
            <button className="tap-scale" onClick={() => setView(view === 'catalog' ? 'admin' : 'catalog')} style={iconBtnStyle}>
              {view === 'catalog' ? <Lock size={18} color="#F4F7F2" /> : <ChevronLeft size={18} color="#F4F7F2" />}
            </button>
          </div>
        </div>

        <div style={{ flex: 1, overflowY: 'auto', WebkitOverflowScrolling: 'touch' }}>
          {view === 'catalog' ? renderCatalog() : renderAdmin()}
        </div>

        {selected && renderProductModal()}
        {cartOpen && renderCartSheet()}
        {editing && renderEditForm()}
        {editingSupplier && renderSupplierForm()}
        {toast && (
          <div className="anim-popIn" style={{ position: 'absolute', bottom: 24, left: '50%', background: '#1D2422', color: '#F4F7F2', padding: '10px 16px', borderRadius: 999, fontSize: 13, zIndex: 100, border: '1px solid #262E2A', whiteSpace: 'nowrap' }}>{toast}</div>
        )}
      </div>
    </div>
  );
}


ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
